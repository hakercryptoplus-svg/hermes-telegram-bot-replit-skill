kind = "api"
previewPath = "/api"
title = "OpenClaw Telegram Bot"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "bash /home/runner/workspace/artifacts/api-server/run_gateway.sh"

[services.production]

[services.production.build]
args = ["bash", "-c", "npm install -g openclaw"]

[services.production.run]
args = ["bash", "artifacts/api-server/run_gateway.sh"]

[services.production.health.startup]
path = "/api"
